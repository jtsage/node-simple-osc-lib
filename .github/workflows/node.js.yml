name: CI
on: [push]
name: Node.js CI
on:
  push:
jobs:
  build:
    name: Build Project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Yarn
        uses: threeal/setup-yarn-action@v2.0.0

      - name: Install Deps
        run: yarn install
      
      - name: Build
        run: yarn build

      - name: Test
        run: yarn test